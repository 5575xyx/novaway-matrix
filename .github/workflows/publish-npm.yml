name: publish-npm
run-name: "publish novaway-ai ${{ inputs.version }}"

# 精简版纯 npm 发布:单 Linux runner 交叉编译全平台二进制 + 发布 novaway-ai 及各平台包。
# 手动触发(Actions 页面 → publish-npm → Run workflow)。首次请填明确的版本号。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号,例如 1.0.0"
        required: true
        type: string
      channel:
        description: "npm dist-tag(正式版用 latest;预览用 beta 等)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write  # 需要写权限以创建 Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 复用仓库已有的 bun 安装 action(与项目要求的 bun 版本一致)
      - uses: ./.github/actions/setup-bun

      - name: Install deps
        run: bun install

      # 交叉编译各平台二进制到 packages/novaway/dist/novaway-*
      # 若因内嵌 Web UI 报错,在下行 build 后加 --skip-embed-web-ui
      - name: Build all-platform binaries
        working-directory: packages/novaway
        run: bun run build
        env:
          NOVAWAY_VERSION: ${{ inputs.version }}
          NOVAWAY_CHANNEL: ${{ inputs.channel }}

      # 创建 GitHub Release 并上传二进制文件
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          release_name: v${{ inputs.version }}
          draft: false
          prerelease: ${{ inputs.channel != 'latest' }}

      # 上传所有平台的二进制文件到 Release(被动备份;npm 原生安装不依赖它)
      - name: Upload Release Assets
        working-directory: packages/novaway
        run: |
          for dir in dist/novaway-*/; do
            platform=$(basename "$dir")
            binary="novaway"
            if [[ "$platform" == *"windows"* ]]; then
              binary="novaway.exe"
            fi

            if [ -f "$dir/bin/$binary" ]; then
              # 打包二进制文件
              tar_name="${platform}-${{ inputs.version }}.tar.gz"
              if [[ "$platform" == *"windows"* ]]; then
                zip_name="${platform}-${{ inputs.version }}.zip"
                (cd "$dir/bin" && zip -q "../../../$zip_name" "$binary")

                # 上传到 Release
                gh release upload "v${{ inputs.version }}" "$zip_name" --clobber
              else
                (cd "$dir/bin" && tar czf "../../../$tar_name" "$binary")

                # 上传到 Release
                gh release upload "v${{ inputs.version }}" "$tar_name" --clobber
              fi
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 配置 npm 鉴权(令牌来自仓库 Secret: NPM_TOKEN)
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 发布 npm 包:各平台二进制包 xymt-novaway-<os>-<arch> + 主包 xymt-novaway(挂 optionalDependencies)。
      # 用户 `npm i -g xymt-novaway` 时,npm 按 os/cpu 只装匹配平台的二进制包,无需从 GitHub 下载。
      # 国内用户把 registry 指向 https://registry.npmmirror.com 即可高速安装。
      - name: Publish to npm
        working-directory: packages/novaway
        run: bun run script/publish.ts
        env:
          NOVAWAY_VERSION: ${{ inputs.version }}
          NOVAWAY_CHANNEL: ${{ inputs.channel }}
