name: powersnexus-kpi-nightly

on:
  schedule:
    # UTC 18:15 ≈ 北京时间 02:15
    - cron: "15 18 * * *"
  workflow_dispatch:

concurrency:
  group: powersnexus-kpi-nightly
  cancel-in-progress: false

jobs:
  kpi-ubuntu:
    name: KPI nightly (ubuntu)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run KPI nightly baseline
        shell: bash
        run: |
          bun packages/desktop/scripts/run-kpi-nightly-baseline.mjs

      - name: Upload KPI artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: powersnexus-kpi-${{ github.run_id }}
          path: |
            .codex/powersnexus-kpi/**
          if-no-files-found: warn
          retention-days: 14

  # Windows 可选：本地任务计划更贴近桌面打包路径；CI 用 ubuntu 做逻辑回归即可。
  # 如需 GitHub Windows runner，可复制本 job 并改 runs-on。
