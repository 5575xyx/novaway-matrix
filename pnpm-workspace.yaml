# package.json 的 overrides（catalog: 已展开成具体版本）。
overrides:
  "@effect/platform-node-shared": "4.0.0-beta.65"
  "@opentui/core": "0.4.5"
  "@opentui/keymap": "0.4.5"
  "@opentui/solid": "0.4.5"
  "@types/bun": "1.3.13"
  "@types/node": "24.12.2"
  "@npmcli/agent": "4.0.0"
  "@standard-community/standard-openapi": "0.2.9"

# bun 的 trustedDependencies：只有这些包允许跑安装脚本（pnpm 默认全部拒绝）。
onlyBuiltDependencies:
  - "esbuild"
  - "node-pty"
  - "protobufjs"
  - "tree-sitter"
  - "tree-sitter-bash"
  - "tree-sitter-powershell"
  - "web-tree-sitter"
  - "electron"
  - "ffmpeg-static"
  - "ffprobe-static"

# 与 package.json 的 patchedDependencies 相同，补丁文件两边共用一份。
patchedDependencies:
  "@npmcli/agent@4.0.0": "patches/@npmcli%2Fagent@4.0.0.patch"
  "@silvia-odwyer/photon-node@0.3.4": "patches/@silvia-odwyer%2Fphoton-node@0.3.4.patch"
  "@standard-community/standard-openapi@0.2.9": "patches/@standard-community%2Fstandard-openapi@0.2.9.patch"
  "solid-js@1.9.10": "patches/solid-js@1.9.10.patch"
  "ssh2@1.17.0": "patches/ssh2@1.17.0.patch"

# bunfig.toml 的 minimumReleaseAge（秒换算成分钟）：新版本要发布满这么久才会被解析到。
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@opentui/core"
  - "@opentui/core-darwin-arm64"
  - "@opentui/core-darwin-x64"
  - "@opentui/core-linux-arm64"
  - "@opentui/core-linux-x64"
  - "@opentui/core-win32-arm64"
  - "@opentui/core-win32-x64"
  - "@opentui/keymap"
  - "@opentui/solid"
