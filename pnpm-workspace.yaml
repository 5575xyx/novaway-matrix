# 此文件由 script/sync-pnpm-workspace.mjs 生成，请勿手改。
#
# 真源是根 package.json 的 workspaces / trustedDependencies / patchedDependencies
# 以及 bunfig.toml 的 exact / minimumReleaseAge。改完跑：
#   node script/sync-pnpm-workspace.mjs

packages:
  - "packages/*"
  - "packages/console/*"
  - "packages/sdk/js"
  - "packages/slack"

